<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>GLSL Mandala V2</title>

        <style>
            * {
                margin: 0;
                padding: 0;
            }
        </style>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
                    "orbitControls": "https://unpkg.com/three@0.185.1/examples/jsm/controls/OrbitControls.js",
                    "effectComposer": "https://unpkg.com/three@0.185.1/examples/jsm/postprocessing/EffectComposer.js",
                    "renderPass": "https://unpkg.com/three@0.185.1/examples/jsm/postprocessing/RenderPass.js",
                    "shaderPass": "https://unpkg.com/three@0.185.1/examples/jsm/postprocessing/ShaderPass.js"
                }
            }
        </script>
    </head>
    <body>
        <script type="module" async>

        import * as THREE from 'three';
        import { EffectComposer } from 'effectComposer';
        import { RenderPass } from 'renderPass';
        import { ShaderPass } from 'shaderPass';

        //################################################## // VARIABLES
        //let controls;
        let renderer, canvas, compose, pass, shader;
        let scene, camera, light, pointLight;
        let cameraDistance = 1.0; let fieldOfView = 75; let nearPlane = 0.1; let farPlane = 1000;
        const speed = 0.001;

        const width = window.innerWidth;
        const height = window.innerHeight;
        const aspectRatio = width / height;
        const pixelRatio = window.devicePixelRatio;

        //################################################## // RENDER
        let writeBuffer;
        function renderSetup() {
            writeBuffer = new THREE.WebGLRenderTarget(width, height);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(pixelRatio);
            renderer.setSize(width, height);

            canvas = new THREE.Scene();
            canvas.background = new THREE.Color(0x111111);
        }

        function render() {
            requestAnimationFrame(render);
            renderer.setRenderTarget(null); renderer.clear();
            renderer.render(canvas, camera);
        }

        //################################################## // INIT
        init();
        async function init() {

            //############################################## // LIGHTS, CAMERA, ACTION!
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x000000);

            camera = new THREE.PerspectiveCamera(fieldOfView, aspectRatio, nearPlane, farPlane);
            camera.position.z = cameraDistance;

            light = new THREE.HemisphereLight(0xffffff, 0x000000, 1);
            scene.add(light);

            renderSetup();
            document.body.appendChild(renderer.domElement);

            await startStream();
            draw();
            postPro();
            render();
        }

        //############################################## // STREAM
        let analyse;
        async function startStream() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true, });
                const listen = new THREE.AudioListener(); listen.setMasterVolume(0); camera.add(listen);
                const audio = new THREE.Audio(listen); audio.setMediaStreamSource(stream);
                analyse = new THREE.AudioAnalyser(audio, 2048);
            } catch(err) { console.error('streaming error :(', err)}
        }

        //################################################## // SCENE
        function draw() {
            //plane as big as window / canvas
            const planeHeight = 2 * Math.tan(THREE.MathUtils.degToRad(fieldOfView) / 2) * nearPlane;
            const planeWidth = planeHeight * aspectRatio;

            const geo = new THREE.PlaneGeometry(planeWidth, planeHeight);
            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0.0 }, uSine: { value: 0.0 },
                    uResolution: { value: new THREE.Vector2(width, height) },
                    uAspect: { value: width / height },
                    uMouse: { value: new THREE.Vector2() },
                    uFrequency: { value: 0.0 }, uNormalFrequency: { value: 0.0 },
                },
                vertexShader: `
                varying vec3 vPosition;
                varying vec3 vNormal;
                varying vec2 vUV;

                void main() {

                    vPosition = position;
                    vNormal = normal;
                    vUV = uv;

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                } `,
                fragmentShader: `
                //graphtoy.com
                uniform vec2 uMouse;
                uniform float uTime; uniform float uSine;
                uniform vec2 uResolution; uniform float uAspect;
                uniform float uFrequency; uniform float uNormalFrequency;

                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec2 vUV;

                const float pi = 3.1415926535;

                vec3 gradient(float t) {

                    //https://dev.thi.ng/gradients/
                    vec3 a = vec3(0.7, 0.1, 0.5);
                    vec3 b = vec3(0.37, 0.05, 0.37);
                    vec3 c = vec3(1.0, 2.0, 0.15);
                    vec3 d = vec3(3.0, 0.35, 1.0);

                    return a + b * cos(6.28318 * (c * t + d));
                }

                void main() {
                    vec2 uv = vUV * 2.0 - 1.0; vec2 uv0 = uv;
                    vec3 finalColor = vec3(0.0, 0.0, 0.0);

                    uv += uTime * 0.01;
                    uv += uMouse;

                    for (float i = 0.0; i < 3.0; i++) {
                        uv = fract(uv * 1.5); //split
                        uv -= 0.5; //center

                        float d = length(uv) * exp(-length(uv0));
                        //the distance of each point towards the center

                        float offset = 0.5;
                        vec3 color = gradient(length(uv0) + i * offset + uTime * offset);

                        float freq = 9.0; float seed = uTime * offset;
                        d = sin(d * freq + seed)/freq; //radial animation
                        d = abs(d); //an absolute value from 0 to one - takes out filling
                        //d = smoothstep(0.0, 0.1, d); //threshold with fading

                        float inverse = 0.0125;
                        d = pow(inverse / d, 1.25); //inverted glow rings

                        finalColor += color * d; //multiply color with circles
                        finalColor.x = finalColor.x * uNormalFrequency * 0.75;
                        finalColor.y = finalColor.y * uNormalFrequency * 0.5;
                    }

                    gl_FragColor = vec4(finalColor, 1.0);
                } `,
                side: THREE.DoubleSide
            }, );

            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.z = cameraDistance - nearPlane;
            scene.add(mesh);

            const timer = new THREE.Timer();
            function updateTime(timeStamp) {
                requestAnimationFrame(updateTime);

                timer.update(timeStamp);
                const elapsed = timer.getElapsed();
                mat.uniforms.uTime.value = elapsed;

                const t = (Math.sin(Date.now() * speed) + 1) / 2;
                mat.uniforms.uSine.value = t;

            } updateTime(0.0);

            document.onmousemove = function (mouse) {
                mat.uniforms.uMouse.value.x = mouse.pageX / width;
                mat.uniforms.uMouse.value.y = mouse.pageY / height;
            }

            let averageFrequency, normalFrequency;
            let max = 0.0; let current = 1.0;
            function stream() {
                requestAnimationFrame(stream);
                averageFrequency = analyse.getAverageFrequency();
                mat.uniforms.uFrequency.value = averageFrequency;

                current = averageFrequency;
                if (current > max) { max = current; console.log('abs max:\t' + max); }

                normalFrequency = averageFrequency / max;
                mat.uniforms.uNormalFrequency.value = normalFrequency;

                renderer.setRenderTarget(writeBuffer); renderer.clear();
                renderer.render(scene, camera);
            } stream();
        }

        async function postPro() {
            const geo = new THREE.PlaneGeometry(1.5, 1.5);
            shader = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0.0 }, uSine: { value: 0.0 },
                    uResolution: { value: new THREE.Vector2(width, height) }, uAspect: { value: width / height },
                    uMouse: { value: new THREE.Vector2() }, uFrequency: { value: 0.0 }, uNormalFrequency: { value: 0.0 },
                    uTexture: { value: writeBuffer.texture }
                },
                vertexShader: `

                varying vec3 vPosition;
                varying vec3 vNormal;
                varying vec2 vUV;

                void main() {
                    vPosition = position;
                    vNormal = normal;
                    vUV = uv;

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }

                `,
                fragmentShader: `

                uniform vec2 uMouse;
                uniform float uTime; uniform float uSine;
                uniform vec2 uResolution; uniform float uAspect;
                uniform float uFrequency; uniform float uNormalFrequency;

                uniform sampler2D uTexture;

                varying vec2 vTexCoord;
                varying vec3 vPosition;
                varying vec3 vNormal;
                varying vec2 vUV;

                const float pi = 3.1415926535;
                float cubicHermite(float n) { return n * n * (3.0 - 2.0 * n); }

                vec2 fisheye(vec2 uv, vec2 xy, float maxFactor) {
                    float d = length(xy);
                    float distortionSize = 2.42; //default: 2.0, OUTER CIRCLE RADIUS!
                    if (d < (distortionSize - maxFactor)) {
                        d = length(xy * maxFactor);

                        float z = sqrt(abs(sin(uNormalFrequency * 0.025 + 0.5)) - d * d); //default: sqrt(1.0 - d * d); INNER CIRCLE RADIUS!
                        z *= abs(sin(uMouse.y * 1.5));
                        float r = atan(d, z) / pi;
                        float phi = atan(xy.y, xy.x); //CIRCLE!
                        phi *= abs(sin(uMouse.x));

                        uv.x = r * cos(phi) + 0.5; uv.y = r * sin(phi) + 0.5;

                        return uv;

                    } else { return 0.5 * xy + 0.5; } //as a reference for the uv reverse calculation
                }

                float burn(float color, float factor) {
                    return (factor == 0.0) ? factor : max((1.0 - ((1.0 - color) / factor)), 0.0);
                }

                float dodge(float color, float factor) {
                    return (factor == 1.0) ? factor : min(color / (1.0 - color), 1.0);
                }

                //https://maximmcnair.com/p/webgl-blend-modes
                vec3 blend(vec3 color, vec3 factor) {
                    vec3 darken = vec3(min(color, factor));
                    vec3 multiply = vec3(color * factor);
                    vec3 screen = vec3(1.0 - ((1.0 - color.r) * (1.0 - factor.r)), 1.0 - ((1.0 - color.g) * (1.0 - factor.g)), 1.0 - ((1.0 - color.b) * (1.0 - factor.b)));
                    vec3 colorBurn = vec3(burn(color.r, factor.r), burn(color.g, factor.g), burn(color.b, factor.b));
                    vec3 colorDodge = vec3(dodge(color.r, factor.r), dodge(color.g, factor.g), dodge(color.b, factor.b));

                    return colorBurn;
                }

                void main() {
                    vec2 uv = vUV;
                    vec2 xy = 2.0 * vUV - 1.0;

                    float aperture = 175.0;
                    float apertureHalf = 0.5 * aperture * (pi / 180.0);
                    float maxFactor = sin(apertureHalf);

                    vec2 finalCoord = fisheye(uv, xy, maxFactor);
                    vec4 texture = texture2D(uTexture, finalCoord);
                    vec3 finalColor = texture.xyz;

                    vec3 col1 = vec3(0.75, 0.5, 0.15);
                    vec3 col2 = vec3(0.75, 1.35, 1.25);

                    float pct = abs(sin(uNormalFrequency * 0.75)); //intenity
                    vec3 col = mix(col1, col2, pct);
                    finalColor = blend(finalColor, col);





                    gl_FragColor = vec4(finalColor, 1.0);
                } `
            });
            const mesh = new THREE.Mesh(geo, shader);
            canvas.add(mesh);

            const timer = new THREE.Timer();
            function updateTime(timeStamp) {
                requestAnimationFrame(updateTime);

                timer.update(timeStamp);
                const elapsed = timer.getElapsed();
                shader.uniforms.uTime.value = elapsed;

                const t = (Math.sin(Date.now() * speed) + 1) / 2;
                shader.uniforms.uSine.value = t;
            } updateTime(0.0);

            window.onmousemove = function (mouse) {
                shader.uniforms.uMouse.value.x = mouse.pageX / width;
                shader.uniforms.uMouse.value.y = mouse.pageY / height;
            }

            let averageFrequency, normalFrequency;
            let max = 0.0; let current = 1.0;
            function stream() {
                requestAnimationFrame(stream);
                averageFrequency = analyse.getAverageFrequency();
                shader.uniforms.uFrequency.value = averageFrequency;

                current = averageFrequency;
                if (current > max) { max = current; }

                normalFrequency = averageFrequency / max;
                shader.uniforms.uNormalFrequency.value = normalFrequency;
            } stream();
        }

        </script>
    </body>
</html>
