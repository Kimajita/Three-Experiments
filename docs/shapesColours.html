<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Testing</title>
        <link rel="icon" href="#"/>

        <style>
            .hide { display: none; }
            * {
                margin: 0;
                padding: 0;
            }
            body {
                width: 100vw; max-width: 100%;
                height: 100vh;  max-height: 100%;
            }
            #canvas {
                background: black;
            }

        </style>

        <script type="importmap">
            {
                "imports": {
                    "three": "https://unpkg.com/three@0.185.1/build/three.module.js",
                    "orbitControls": "https://unpkg.com/three@0.185.1/examples/jsm/controls/OrbitControls.js",
                    "effectComposer": "https://unpkg.com/three@0.185.1/examples/jsm/postprocessing/EffectComposer.js",
                    "renderPass": "https://unpkg.com/three@0.185.1/examples/jsm/postprocessing/RenderPass.js",
                    "shaderPass": "https://unpkg.com/three@0.185.1/examples/jsm/postprocessing/ShaderPass.js"
                }
            }
        </script>
    </head>
    <body>
        <div id="canvas">

        </div>
        <script type="module"async>

        import * as THREE from 'three';
        import { OrbitControls } from 'orbitControls';

        //################################################## // VARIABLES
        let controls;
        let renderer, canvas, compose, pass, shader;
        let scene, camera, light, pointLight;
        let cameraDistance = 0.82; let fieldOfView = 75; let nearPlane = 0.1; let farPlane = 1000;
        const speed = 0.025;

        //################################################## // HTML
        const width = window.innerWidth; const height = window.innerHeight; const aspectRatio = width / height; const pixelRatio = window.devicePixelRatio;
        let canvasElem, canvasWidth, canvasHeight;
        function resize() {
            canvasWidth = canvasElem.offsetWidth; canvasHeight = canvasElem.offsetHeight;
            camera.aspect = canvasWidth / canvasHeight;
            camera.updateProjectionMatrix();

            renderer.setSize(canvasWidth, canvasHeight);
        }

        //################################################## // RENDER
        let writeBuffer;
        function renderSetup() {
            writeBuffer = new THREE.WebGLRenderTarget(width, height);
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setPixelRatio(pixelRatio);
            renderer.setSize(width, height);

            canvas = new THREE.Scene();
            canvas.background = new THREE.Color(0x111111);
        }

        function render() {
            requestAnimationFrame(render);
            //controls.update();
            renderer.setRenderTarget(null); renderer.clear();
            renderer.render(scene, camera);
        }

        //################################################## // INIT
        init();
        async function init() {

            window.addEventListener('resize', resize);

            //############################################## // HTML
            canvasElem = document.querySelector('#canvas');
            canvasWidth = canvasElem.offsetWidth; canvasHeight = canvasElem.offsetHeight;

            //############################################## // LIGHTS, CAMERA, ACTION!
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x151515);

            camera = new THREE.PerspectiveCamera(fieldOfView, aspectRatio, nearPlane, farPlane);
            camera.position.z = cameraDistance;

            light = new THREE.HemisphereLight(0xffffff, 0x000000, 1);
            scene.add(light);

            renderSetup();
            canvasElem.appendChild(renderer.domElement);
            //controls = new OrbitControls(camera, renderer.domElement);
            //controls.enableDamping = true;

            await startStream();
            draw();
            postPro();
            render();
        }

        //############################################## // STREAM
        let analyse;
        async function startStream() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: false, audio: true, });
                const listen = new THREE.AudioListener(); listen.setMasterVolume(0); camera.add(listen);
                const audio = new THREE.Audio(listen); audio.setMediaStreamSource(stream);
                analyse = new THREE.AudioAnalyser(audio, 2048);
            } catch(err) { console.error('streaming error :(', err)}
        }

        //################################################## // SCENE
        function draw() {
            const geo = new THREE.PlaneGeometry(1, 1);
            const mat = new THREE.ShaderMaterial({
                uniforms: {
                    uTime: { value: 0.0 }, uTimeLimit: { value: 0.0 },
                    uColor: { value: new THREE.Color(0.5, 0.0, 0.75) },
                    uResolution: { value: new THREE.Vector2(width, height) },

                    //User Input:
                    uMouse: { value: new THREE.Vector2() },
                    uFrequency: { value: 0.0 }, uNormalFrequency: { value: 0.0 },
                },
                vertexShader: `
                uniform float uTime;
                uniform float uSpeed;

                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec2 vUV;

                void main() {

                    vNormal = normal;
                    vPosition = position;
                    vUV = uv;

                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                } `,
                fragmentShader: `

                uniform vec3 uColor;
                uniform float uTime; uniform float uTimeLimit;
                uniform vec2 uResolution; uniform vec2 uMouse;
                uniform float uFrequency; uniform float uNormalFrequency;

                varying vec3 vNormal;
                varying vec3 vPosition;
                varying vec2 vUV;

                const float pi = 3.1415926535;

                vec2 rotate(vec2 st, float rot) {
                    st -= 0.5;
                    st = mat2(cos(rot), -sin(rot), sin(rot), cos(rot)) * st;
                    st += 0.5;
                    return st;
                }

                vec2 rotateTiles(vec2 st) {
                    st *= 2.0;
                    float index = 0.0;

                    index += step(1.0, mod(st.x, 2.0));
                    index += step(1.0, mod(st.y, 2.0)) * 2.0;

                    st = fract(st);
                    if (index == 1.0) {
                        st = rotate(st, pi * 0.5);
                    } else if (index == 2.0) {
                        st = rotate(st, pi * -0.5);
                    } else if (index == 3.0) {
                        st = rotate(st, pi);
                    }

                    return st;
                }

                void main() {

                    //Basic Setup
                    vec2 uv = vUV;
                    float mult = 2.0;
                    vec2 st = uv * mult - (mult / 2.0);
                    vec3 finalColor = vec3(1.0, 1.0, 1.0);
                    vec2 mouse = vec2(uMouse.x, 1.0 - uMouse.y);

                    //Fractures
                    uv = fract(st * 4.2);
                    uv = rotateTiles(uv);

                    //Gradients
                    vec3 col1 = vec3(0.25, 0.25, 0.0);
                    vec3 col2 = vec3(0.0, 0.25, 0.25);
                    vec3 col3 = vec3(0.25, 0.0, 0.25);
                    vec3 col4 = vec3(0.25, 0.25, 0.25);

                    col1 = vec3(0.7, 0.5, 0.65);
                    col2 = vec3(0.3, 0.15, 0.9);
                    col3 = vec3(0.7, 0.35, 0.75);
                    col4 = vec3(0.15, 0.82, 1.0);

                    float freq1 = 0.25; float amp1 = 1.5; float off1 = 0.25;
                    float freq2 = 0.5; float amp2 = 3.0; float off2 = 0.0;
                    float freq3 = 1.0; float amp3 = 5.0; float off3 = 0.0;
                    float freq4 = 2.0; float amp4 = 7.0; float off4 = -0.5;

                    vec3 blend1 = mix(col1, col2, sin(uTime * freq1) * amp1 + off1);
                    vec3 blend2 = mix(col2, col3, cos(uTime * freq2) * amp2 + off2);
                    vec3 blend3 = mix(col3, col4, sin(uTime * freq3) * amp3 + off3);
                    vec3 blend4 = mix(col4, col1, cos(uTime * freq4) * amp4 + off4);

                    vec3 grad1 = mix(blend1, blend2, uv.x);
                    vec3 grad2 = mix(blend3, blend4, uv.y);
                    vec3 gradient = mix(grad1, grad2, abs(st.x * st.y));

                    //SDF (signed distance function)
                    float range = 0.025; float min = 0.37;
                    float radius = pow(uNormalFrequency, 2.0) * range + min;

                    //vec3 circle = vec3(0.5, 0.5, radius); //position x and y, radius z
                    vec3 circle = vec3(sin(mouse * 0.25 + 0.375), radius);

                    float d = length(uv - circle.xy) - circle.z; //length calculates the distance (which is the border between the shape and the outside)
                    //calc: length between the current position and the shapes center position, from which the radius is subtracted to get the distance to the EDGE of the shape
                    d = fract(d * mix(7.0, 13.0, sin(uTime * freq2)));

                    //next we check if we're inside the shape or not so we can either draw black or white:
                    float black = 0.0; float white = 2.0;
                    d = smoothstep(black, white, d); //sharpens edge, if d > 0.1 display white, if d < 0 display black, interpolate inbetween

                    //finalColor = -vec3(d - gradient);
                    finalColor = vec3(d / gradient);
                    finalColor = pow(finalColor, vec3(-10.5)) + vec3(0.0);

                    gl_FragColor = vec4(finalColor, 1.0);
                } `,
                side: THREE.DoubleSide,
            });

            const mesh = new THREE.Mesh(geo, mat);
            scene.add(mesh);

            //FUNCTIONS
            let time = 0.0; let timeLimit = 0.0;
            let timer1 = new THREE.Timer(); let timer2 = new THREE.Timer();
            let averageFrequency, normalFrequency; let max = 0.0; let current = 1.0;
            function update(timeStamp) {
                requestAnimationFrame(update);
                mat.uniforms.uTime.value = time;
                //mat.uniforms.uTimeLimit.value = timeLimit;

                timer1.update(timeStamp);
                //timer2.update(timeStamp);

                time = timer1.getElapsed();
                //timeLimit = timer2.getElapsed();

                //if (timeLimit > 42.0) { timer2 = new THREE.Timer(); }
                //console.log(time + "\t\t\t" + timeLimit);

                //AUDIO
                averageFrequency = analyse.getAverageFrequency(); mat.uniforms.uFrequency.value = averageFrequency;
                normalFrequency = averageFrequency / max; mat.uniforms.uNormalFrequency.value = normalFrequency;

                current = averageFrequency;
                if (current > max) { max = current; console.log('abs max:\t' + max); }

            } update(0.0);

            document.onmousemove = function (mouse) {
                mat.uniforms.uMouse.value.x = mouse.pageX / width;
                mat.uniforms.uMouse.value.y = mouse.pageY / height;
            }
        }

        </script>
    </body>
</html>
